<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ điều khiển IoT</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: sans-serif;
    background: #dfdfdf;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

header h1 {
    font-size: clamp(24px, 4vw, 40px);
    margin-bottom: 20px;
}

.card {
    background: #efefef;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 95%;
    max-width: 1200px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.monitor-section {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 20px;
}

.gauge-group {
    flex: 1;
    min-width: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.gauge-title {
    margin-bottom: 10px;
    font-size: 18px;
}

.gauge-visual {
    width: 180px;
    height: 180px;
    position: relative;
}

.gauge-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.gauge-track {
    fill: none;
    stroke: #ccc;
    stroke-width: 18;
}

.gauge-fill {
    fill: none;
    stroke: #4CAF50;
    stroke-width: 18;
    stroke-dasharray: 502;
    stroke-dashoffset: 502;
    transition: stroke-dashoffset 0.4s ease;
}

.gauge-fill.water {
    stroke: #2196F3;
}

.gauge-value {
    position: absolute;
    font-size: 32px;
    font-weight: bold;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.controls-center {
    display: flex;
    align-items: center;
    gap: 20px;
}

.btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.off { background: red; }
.on  { background: green; }

.slider-section {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.slider-group {
    flex: 1;
    min-width: 250px;
    background: #ddd;
    padding: 15px;
    border-radius: 10px;
}

.slider-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

input[type=range] {
    width: 100%;
}

@media (max-width: 768px) {
    .monitor-section {
        flex-direction: column;
        align-items: center;
    }

    .controls-center {
        justify-content: center;
    }
}
</style>
</head>

<body>

<header>
    <h1>Bộ điều khiển</h1>
</header>

<div class="card">

    <!-- ===== GAUGE ===== -->
    <div class="monitor-section">

        <div class="gauge-group">
            <div class="gauge-title">Độ ẩm</div>
            <div class="gauge-visual">
                <svg viewBox="0 0 200 200" class="gauge-svg">
                    <circle cx="100" cy="100" r="80" class="gauge-track"/>
                    <circle cx="100" cy="100" r="80" class="gauge-fill" id="mois-fill"/>
                </svg>
                <div class="gauge-value" id="mois-val">--</div>
            </div>
        </div>

        <div class="controls-center">
            <button id="btn-auto" class="btn off">AUTO</button>
            <button id="btn-pump" class="btn off">PUMP</button>
        </div>

        <div class="gauge-group">
            <div class="gauge-title">Mực nước</div>
            <div class="gauge-visual">
                <svg viewBox="0 0 200 200" class="gauge-svg">
                    <circle cx="100" cy="100" r="80" class="gauge-track"/>
                    <circle cx="100" cy="100" r="80" class="gauge-fill water" id="water-fill"/>
                </svg>
                <div class="gauge-value" id="water-val">--</div>
            </div>
        </div>

    </div>

    <!-- ===== SLIDER ===== -->
    <div class="slider-section">

        <div class="slider-group">
            <div class="slider-header">
                <span>Ngưỡng độ ẩm</span>
                <span id="val-mois">0</span>
            </div>
            <input type="range" id="sl-mois" min="0" max="100">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Ngưỡng mực nước</span>
                <span id="val-water">0</span>
            </div>
            <input type="range" id="sl-water" min="0" max="100">
        </div>

    </div>

</div>

<script>
//CONFIG
const BASE = "http://vuonthongminh.local";
const MAX = 100;
const CIRC = 502.65;
const INTERVAL = 5000;

//STATE
let state = {
    auto: 0,
    pump: 0
};

//DOM
const $ = id => document.getElementById(id);

//UTILS
const clamp = v => Math.max(0, Math.min(MAX, v));

const updateGauge = (el, val) => {
    const offset = CIRC * (1 - clamp(val)/100);
    el.style.strokeDashoffset = offset;
};

const setBtn = (btn, on) => {
    btn.classList.toggle("on", on);
    btn.classList.toggle("off", !on);
};

//API
const api = async (url) => {
    try {
        const res = await fetch(BASE + url);
        if (!res.ok) throw "HTTP error";
        return await res.json();
    } catch(e) {
        console.log("Lỗi:", e);
        return null;
    }
};

const send = (url) => fetch(BASE + url).catch(()=>{});

//EVENTS
const setupSlider = (sl, val, url) => {
    sl.oninput = () => val.textContent = sl.value;
    sl.onchange = () => send(`${url}?val=${sl.value}`);
};

const toggleAuto = () => {
    state.auto ^= 1;
    if (state.auto) {
        state.pump = 0;
        setBtn($("btn-pump"), 0);
    }
    setBtn($("btn-auto"), state.auto);
    send(`/toggle/auto?state=${state.auto}`);
};

const togglePump = () => {
    state.pump ^= 1;
    if (state.pump) {
        state.auto = 0;
        setBtn($("btn-auto"), 0);
    }
    setBtn($("btn-pump"), state.pump);
    send(`/toggle/pump?state=${state.pump}`);
};

//DATA
const refresh = async () => {
    const data = await api("/data");
    if (!data) return;

    $("mois-val").textContent = data.mois;
    $("water-val").textContent = data.water;

    updateGauge($("mois-fill"), data.mois);
    updateGauge($("water-fill"), data.water);
};

const sync = async () => {
    const st = await api("/state");
    if (!st) return;

    state = st;

    setBtn($("btn-auto"), st.auto);
    setBtn($("btn-pump"), st.pump);

    $("sl-mois").value = st.moisThres;
    $("val-mois").textContent = st.moisThres;

    $("sl-water").value = st.levThres;
    $("val-water").textContent = st.levThres;
};

const init = () => {
    setupSlider($("sl-mois"), $("val-mois"), "/set/mois");
    setupSlider($("sl-water"), $("val-water"), "/set/water");

    $("btn-auto").onclick = toggleAuto;
    $("btn-pump").onclick = togglePump;

    refresh();
    sync();

    setInterval(() => {
        refresh();
        sync();
    }, INTERVAL);
};

init();
</script>

</body>
</html>
